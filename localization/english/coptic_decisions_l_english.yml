l_english:
 coptic_revive_tongue_decision: "Revive the Coptic Tongue"
 coptic_revive_tongue_decision_desc: "Arabic is spreading through the towns of [GetTitleByKey('k_egypt').GetName], and the language of our fathers now lives on mostly in the monasteries and the liturgy. With the scribes and monks of the Church behind us, we can bring Coptic back into the streets and markets."
 coptic_revive_tongue_decision_tooltip: "Bring the Coptic language back to the Arabic-speaking towns of Egypt."
 coptic_revive_tongue_decision_confirm: "Let the old tongue be heard again!"
 coptic_revive_tongue_alexandria_realm_tt: "[GetTitleByKey('c_alexandria').GetName] is in your realm"
 coptic_revive_tongue_alexandria_coptic_tt: "The holder of [GetTitleByKey('c_alexandria').GetName] is of Coptic culture"
 coptic_revive_tongue_conversion_tt: "For 20 years, every Arabic-speaking county of Egypt in your realm gets #V Coptic Revival#!: your steward can work there on the task #V Revive the Coptic Tongue#!"
 coptic_revive_tongue_prosperity_tt: "For 20 years, every Coptic county of Egypt in your realm gets #V Coptic Revival#!: #P +30%#! prosperity growth"
 coptic_revive_tongue_fervor_desc: "Revived the Coptic tongue"
 coptic_tongue_revival_modifier: "Coptic Revival"
 coptic_tongue_revival_modifier_desc: "Monks and scribes are teaching the old language again. Here a Coptic steward can revive the Coptic tongue."
 coptic_tongue_revival_prosperity_modifier: "Coptic Revival"
 coptic_tongue_revival_prosperity_modifier_desc: "The revival of the Coptic tongue brings new life to the Coptic towns of Egypt."
 coptic_tongue_revival_opinion: "Revived the Coptic tongue"
 COPTIC_REVIVAL_PROMOTE_CULTURE_BONUS: "Coptic Revival"
 task_coptic_revive_tongue: "Revive the Coptic Tongue"
 coptic_tongue_revival_county_tt: "The [county|E] has #V Coptic Revival#!"
